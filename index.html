<style id="app-style">
/* Layout: festive quick-shop. Berry header with marigold toran and search, Diwali banner, 3-step order guide, Top selling carousel, Shop-by-category tiles, product grid, detail + share sheets, berry cart bar. One committed light festive look. */
:root{
  --bg:#FFF3EA; --surface:#FFFFFF; --ink:#2A1622; --muted:#7A6570; --line:#F1DCD2; --soft:#FCEBE3;
  --berry:#8C2366; --berry-deep:#6E1A50; --berry-soft:#FBEEF5; --rose:#C2185B;
  --saffron:#F2A33A; --marigold:#FF8A1F; --offer:#E8731A; --save:#178A3A; --danger:#D23B2E; --tile:#FFF5EC; --wa:#1FA855;
  --hand:"Kalam","Comic Sans MS",cursive;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(900px 420px at 50% 0,rgba(255,170,60,.18),transparent 70%),var(--pattern,none);background-size:auto,140px 140px;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--berry-deep)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1200px;margin:0 auto}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(100deg,var(--berry-deep),#A3174E 60%,var(--rose));color:#fff;padding-block:12px;box-shadow:0 2px 12px rgba(123,30,90,.25)}
.hdr .inner{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--offer);box-shadow:0 0 0 3px rgba(255,255,255,.3);overflow:hidden;flex:none}
.logo img{width:84%;height:84%;object-fit:contain}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:0 0 18px}
.brand .bl{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #FFE3C4,0 0 0 6px var(--saffron),0 10px 26px rgba(232,115,26,.28);overflow:hidden}
.brand .bl img{width:80%;height:80%;object-fit:contain}
.brand .bl b{font-size:40px;color:var(--offer)}
.brand h2{margin:6px 0 0;font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1.1;letter-spacing:-.01em;color:var(--berry-deep);text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.brand p i{width:8px;height:8px;border-radius:50%;background:var(--save);display:inline-block}
.brand .orn{display:flex;align-items:center;gap:8px;color:var(--offer);font-family:var(--hand);font-size:15px}
.brand .orn svg{width:70px;height:20px}
.shop{min-width:0}
.shop .eta{opacity:.92;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.shop .eta i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--saffron);box-shadow:0 0 8px var(--saffron);flex:none}
.shop h1{margin:1px 0 0;font-size:20px;font-weight:800;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.hbtns{display:flex;gap:6px}
.hbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;font-weight:700;font-size:12.5px;color:#fff;display:inline-flex;align-items:center;gap:6px}
.hbtn svg{width:16px;height:16px}
.hbtn.on{background:#fff;color:var(--berry-deep);border-color:#fff}
.hbtns.own #shareShop span,.hbtns.own #a2hs span{display:none}
.hbtns.own{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hbtns.own #toggleManage{grid-column:1/-1;justify-content:center}
.hbtns.own .hbtn{justify-content:center}
.hbtns:not(.own){flex-direction:column;align-items:stretch;gap:5px}
.hbtns:not(.own) .hbtn{padding:5px 10px;font-size:12px}
.search{grid-column:1/-1;position:relative}
.search input{width:100%;border:0;border-radius:12px;background:#fff;color:#1C1C1C;padding:12px 14px 12px 40px;font-size:15px}
.search input::placeholder{color:#8A8F99}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#5A5F69}
.toran{position:absolute;left:0;right:0;top:100%;height:46px;pointer-events:none;overflow:hidden}
.toran svg{display:block;width:100%;height:100%}
.page{padding-block:44px 120px}

/* banner */
.banner{border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(110deg,var(--rose) 0%,#D9433A 50%,#F08A24 100%);color:#fff;padding:20px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(194,24,91,.22)}
.banner .lights{position:absolute;left:0;right:0;top:0;height:10px;background:radial-gradient(circle,#FFD54A 0 3px,transparent 3.5px) 0 2px/22px 10px repeat-x}
@media (prefers-reduced-motion:no-preference){.banner .lights{animation:twinkle 1.4s steps(2) infinite}}
@keyframes twinkle{50%{opacity:.45}}
.banner small{font-family:var(--hand);font-size:16px;opacity:.95}
.banner h2{margin:2px 0 0;font-size:24px;font-weight:800;line-height:1.1;text-wrap:balance}
.banner p{margin:6px 0 0;font-size:13px;opacity:.92;max-width:44ch;white-space:pre-line}
.banner .cta{margin-top:12px;display:inline-block;border:0;background:#fff;color:#A3174E;font-weight:800;font-size:13px;border-radius:10px;padding:8px 12px}
.banner canvas{width:118px;height:118px;max-width:100%}

/* how to order */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;line-height:1.25;min-width:0}
.how b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--berry-soft);color:var(--berry);display:grid;place-items:center;font-size:12px}

/* section titles */
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}
.sec-t h3{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-t h3 svg{width:22px;height:22px;flex:none}
.sec-t span,.sec-t button.link{color:var(--berry);font-size:13px;font-weight:700;background:none;border:0;padding:0}
.notice{background:#FFF7DB;color:#5A4500;border:1px solid #F3DE94;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}

/* top selling */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:168px;scroll-snap-align:start}
.top-wrap{background:linear-gradient(180deg,#FFE3C4,#FFF0E2);border:1px solid #F7D2AE;border-radius:18px;padding:4px 12px 6px;margin-top:20px}
.top-wrap .sec-t{margin:12px 0 10px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:700px){.cats{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--ink);min-width:0}
.cat .ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center}
.cat .ico svg{width:40px;height:40px}
.cat .ico.ph{width:100%;height:auto;aspect-ratio:1/1;max-width:120px;overflow:hidden;border-radius:14px;box-shadow:0 2px 8px rgba(160,60,40,.12)}
.cat .ico.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cat small{font-weight:600;color:var(--muted);font-size:11px;margin-top:-4px}
.cat.on{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry) inset;background:var(--berry-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.cat small.soon{color:#fff;background:var(--offer);border-radius:999px;padding:2px 8px;margin-top:-2px}
.soonbox{grid-column:1/-1;text-align:center;background:var(--surface);border:2px dashed #F2A33A;border-radius:16px;padding:28px 18px}
.soonbox b{display:block;font-size:20px;color:var(--berry-deep)}
.soonbox p{margin:8px auto 0;color:var(--muted);max-width:40ch}
.a2hs{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:1.5px dashed var(--berry);background:var(--berry-soft);border-radius:14px;padding:10px 14px;text-align:left;color:var(--ink)}
.a2hs .a2i{width:38px;height:38px;border-radius:10px;background:var(--berry);color:#fff;display:grid;place-items:center;flex:none}
.a2hs .a2i svg{width:20px;height:20px}
.a2hs b{display:block;font-size:14px;color:var(--berry-deep)}
.a2hs small{display:block;color:var(--muted);font-size:12px}
.a2hs .go{margin-left:auto;font-size:22px;color:var(--berry);font-weight:800}
.hs{margin-top:10px}.hs h4{margin:0 0 4px;font-size:14px;color:var(--berry-deep)}
.hs ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.shr{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.chip.on{background:var(--berry);border-color:var(--berry);color:#fff}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.sortl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.sortl select{width:auto;padding:8px 32px 8px 12px;font-size:13px;font-weight:700;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--berry) 50%),linear-gradient(135deg,var(--berry) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.clr{border:0;background:none;color:var(--berry);font-weight:800;font-size:13px;padding:6px 2px;text-decoration:underline}
.bchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;align-items:center}
.bchips::-webkit-scrollbar{display:none}
.bchips .bl{flex:none;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.bchip{flex:none;border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;color:var(--ink)}
.bchip small{color:var(--muted);font-weight:700;margin-left:2px}
.bchip.on{border-style:solid;border-color:var(--offer);background:#FFF1E3;color:#9A4A0B}
.bchip.on small{color:#9A4A0B}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
@media (min-width:1080px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(160,60,40,.07);border-radius:16px;padding:8px;display:flex;flex-direction:column;min-width:0;position:relative}
.open{border:0;background:none;padding:0;text-align:left;display:block;width:100%;color:inherit}
.pic{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--tile)}
.pic img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.off{position:absolute;top:0;left:8px;background:var(--offer);color:#fff;font-size:10px;font-weight:800;line-height:1.1;text-align:center;padding:5px 5px 7px;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);min-width:34px}
.best{position:absolute;left:0;bottom:8px;background:linear-gradient(90deg,var(--berry),var(--rose));color:#fff;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px 3px 7px;border-radius:0 999px 999px 0}
.stamp{position:absolute;right:6px;bottom:8px;background:rgba(255,255,255,.9);color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px}
.share-ic{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--berry);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:1}
.share-ic svg{width:16px;height:16px}
.soldout{position:absolute;inset:0;background:rgba(255,255,255,.62);display:grid;place-items:center;font-weight:800;color:#2A1622;font-size:13px}
.art{position:absolute;inset:0;display:grid;place-items:center}
.art svg{width:62%;height:62%}
.meta{padding:8px 2px 0;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.name{font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.size{color:var(--muted);font-size:12px;font-weight:500}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding-top:8px}
.price b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.price b.ask{font-size:13px;color:var(--offer)}
.price s{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.add{border:1.5px solid var(--berry);background:var(--berry-soft);color:var(--berry);font-weight:800;font-size:13px;border-radius:10px;padding:7px 14px;min-width:70px}
.step{display:inline-flex;align-items:center;background:var(--berry);color:#fff;border-radius:10px;overflow:hidden;min-width:70px;justify-content:space-between}
.step button{border:0;background:transparent;color:inherit;width:26px;height:34px;font-size:17px;font-weight:800}
.step span{font-weight:800;font-size:13px;min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.owner-row{display:flex;gap:6px;padding-top:8px}
.owner-row button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 4px;font-weight:700;font-size:12px}
.owner-row .del{color:var(--danger);border-color:var(--danger)}
.addcard{border:2px dashed var(--line);border-radius:16px;background:rgba(255,255,255,.5);min-height:220px;font-weight:800;color:var(--berry)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;grid-column:1/-1}
.flourish{display:flex;align-items:center;justify-content:center;gap:10px;margin:30px 0 0;color:var(--muted);font-family:var(--hand);font-size:17px;text-align:center}
.flourish svg{width:120px;height:28px;flex:none;max-width:28%}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(160,60,40,.12)}}

/* cart bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:8px;pointer-events:none}
.bar-in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(100deg,var(--berry),var(--rose));color:#fff;border:0;width:100%;border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(140,35,102,.35);text-align:left}
.bar-in .l{display:flex;align-items:center;gap:10px;min-width:0}
.bar-in .ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.bar-in .ic svg{width:20px;height:20px}
.bar-in small{display:block;font-size:12px;font-weight:600;opacity:.9}
.bar-in b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.bar-in .go{font-weight:800;font-size:15px;white-space:nowrap}
.bar-in.owner{background:var(--offer);box-shadow:0 8px 24px rgba(232,115,26,.35)}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(30,6,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sh-head{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);z-index:2}
.sh-head h2{margin:0;font-size:17px;font-weight:800}
.x{border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;font-size:18px;flex:none}
.blk{background:var(--surface);border-radius:14px;margin:12px max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-left,0px));padding:12px 14px}
.blk h4{margin:0 0 8px;font-size:15px;font-weight:800}
.dpic{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--tile)}
.dpic>img{width:100%;height:100%;object-fit:contain;background:#fff}
.dpic img[data-zoom]{cursor:zoom-in}
.zbtn{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--berry);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}

  function encodeCanvas(c,q){var u='';try{u=c.toDataURL('image/webp',q)}catch(e){}if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/jpeg',q);return u}
  function makeBoth(file,cb){
    var r=new FileReader();
    r.onload=function(){var img=new Image();img.onload=function(){
      var w=img.width,h=img.height;
      var k=Math.min(1,1000/Math.max(w,h));var f=document.createElement('canvas');f.width=Math.round(w*k);f.height=Math.round(h*k);
      var g=f.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,f.width,f.height);g.drawImage(img,0,0,f.width,f.height);
      var S=380,t=document.createElement('canvas');t.width=S;t.height=S;var tg=t.getContext('2d');tg.fillStyle='#fff';tg.fillRect(0,0,S,S);
      var ks=Math.min(S/w,S/h);var tw=w*ks,th=h*ks;tg.drawImage(img,(S-tw)/2,(S-th)/2,tw,th);
      cb({t:encodeCanvas(t,.75),f:encodeCanvas(f,.68)});
    };img.onerror=function(){cb(null)};img.src=r.result};
    r.onerror=function(){cb(null)};r.readAsDataURL(file);
  }
  function resizeImage(file,cb,png){
    var r=new FileReader();
    r.onload=function(){var img=new Image();img.onload=function(){
      var max=png?240:560,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      var g=c.getContext('2d');if(!png){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}g.drawImage(img,0,0,c.width,c.height);cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.8));
    };img.onerror=function(){cb(null)};img.src=r.result};
    r.onerror=function(){cb(null)};r.readAsDataURL(file);
  }

    if(d.share){openSheet('share',d.share);return}
    if(d.edit){openSheet('edit',d.edit);return}
    if(d.rmimg){pend[d.rmimg]=null;keepEdit(renderSheet);return}
    if(d.zoomopen!==undefined||d.zoom!==undefined){var gl0=document.getElementById('gal');openZoom(d.zoom!==undefined?Number(d.zoom):(gl0?Math.round(gl0.scrollLeft/Math.max(1,gl0.clientWidth)):0));return}
    if(d.gal){var gl=document.getElementById('gal');if(gl)gl.scrollBy({left:gl.clientWidth*Number(d.gal),behavior:'smooth'});return}
    if(d.askdel){confirmDel=d.askdel;refreshGrid();return}
    if(d.del){state.packs=state.packs.filter(function(p){return p.id!==d.del});confirmDel=null;dirty=true;refreshGrid();renderBar();return}
    switch(t.id){
      case 'toggleManage':manage=!manage;confirmDel=null;render();break;
      case 'a2hs':if(window.__a2hs){var ev=window.__a2hs;window.__a2hs=null;ev.prompt();ev.userChoice.then(function(r){if(r&&r.outcome==='accepted')toast('Added to your home screen')}).catch(function(){})}else openSheet('home',null);break;
      case 'shareShop':openSheet('share',null);break;
      case 'shopNow':jumpToGrid();break;
      case 'clearF':brand='All';sortBy='rec';refreshGrid();break;
      case 'count':dropLayers(['cat']);cat='All';brand='All';q='';var qi2=document.getElementById('q');if(qi2)qi2.value='';refreshGrid();break;
      case 'openCart':case 'openCart2':openSheet('cart');break;
      case 'editStore':openSheet('store');break;
      case 'addPack':openSheet('edit',null);break;
      case 'shareWa':openLink('https://wa.me/?text='+encodeURIComponent(shareMessage()));break;
      case 'copyLink':{var p0=curId?pack(curId):null;copyText(p0?packUrl(p0):shopUrl(),'Link copied. Paste it anywhere to share.','linkOut');break}
      case 'saveStore':
        if(pendingLogo&&pendingLogo.indexOf('data:')===0&&assetsApi){var lb=t;lb.disabled=true;lb.textContent='Saving\u2026';toBlobUrl(pendingLogo).then(function(u){pendingLogo=u;lb.disabled=false;lb.click()},function(){lb.disabled=false;lb.textContent='Save';toast('The logo couldn\u2019t be saved. Try again.')});break}
        state.store.name=document.getElementById('sName').value.trim()||'Gift Pack Shop';
        state.store.delivery=document.getElementById('sDel').value.trim();
        state.store.tagline=document.getElementById('sTag').value.trim();
        state.store.whatsapp=document.getElementById('sWa').value.trim();
        if(pendingLogo!==undefined){if(pendingLogo)state.store.logo=pendingLogo;else delete state.store.logo}pendingLogo=undefined;
        dirty=true;sheet=null;render();toast('Saved. Publish to make it live.');break;
      case 'rmLogo':pendingLogo=null;document.getElementById('logoPrev').innerHTML='';t.remove();break;
      case 'rmImg':pendingImage=null;document.getElementById('thumb').innerHTML='';t.remove();break;
      case 'savePack':{
        var name=document.getElementById('pName').value.trim(),price=Number(document.getElementById('pPrice').value),mrp=Number(document.getElementById('pMrp').value)||0;
        if(!name){document.getElementById('pErr').textContent='Add a pack name.';break}
        if(document.getElementById('pPrice').value!==''&&!(price>0)){document.getElementById('pErr').textContent='Enter a price above 0, or leave it empty to show \u201CAsk price\u201D.';break}
        var data={name:name,brand:(document.getElementById('pBrand')||{value:''}).value.trim(),size:document.getElementById('pSize').value.trim(),category:document.getElementById('pCat').value,desc:document.getElementById('pDesc').value.trim(),
          price:price>0?Math.round(price*100)/100:0,mrp:price>0&&mrp>price?Math.round(mrp*100)/100:0,best:document.getElementById('pBest').checked,byWeight:!!(document.getElementById('pBW')||{}).checked,inStock:document.getElementById('pStock').checked,sample:false};
        var sb=t;sb.disabled=true;sb.textContent='Saving photos\u2026';
        storePend().then(function(){
        var tgt;if(curId){tgt=pack(curId);Object.assign(tgt,data)}else{data.id='p'+Date.now().toString(36);data.hue=Math.floor(Math.random()*360);state.packs.push(data);tgt=data}
        ['image','image2'].forEach(function(k){var fk=k==='image'?'full':'full2';if(pend[k]!==undefined){if(pend[k]){tgt[k]=pend[k].t;tgt[fk]=pend[k].f}else{delete tgt[k];delete tgt[fk]}}});
        if(!tgt.image&&tgt.image2){tgt.image=tgt.image2;delete tgt.image2;if(tgt.full2){tgt.full=tgt.full2;delete tgt.full2}}pend={};
        dirty=true;closeSheet();render();toast('Pack saved. Publish to make it live.');
        },function(){sb.disabled=false;sb.textContent='Save pack';var pe=document.getElementById('pErr');if(pe)pe.textContent='The photo couldn\u2019t be saved. Check your internet and tap Save again.'});break}
      case 'publish':
        if(!artifactApi){toast('Publishing isn’t available in this view.');break}
        t.disabled=true;t.querySelector('b').textContent='Publishing…';
        artifactApi.publish(buildDoc()).catch(function(er){
          var c=er&&er.code;
          if(c==='conflict')return;
          if(c==='not_writer'||c==='not_granted'){canEdit=false;manage=false;render();toast('This view is read-only.');return}
          t.disabled=false;t.querySelector('b').textContent='Publish changes';toast(c==='rate_limited'?'Too many saves. Wait a moment and try again.':'Couldn’t publish. Try again.');
        });break;
      case 'sendWa':
        openLink('https://wa.me/'+waNumber()+'?text='+encodeURIComponent(orderMessage()));
        showMsg('If WhatsApp didn’t open, copy this message and send it to +'+waNumber()+':');break;
      case 'copyMsg':{
        var m=orderMessage();
        try{navigator.clipboard.writeText(m).then(function(){toast('Order copied. Paste it in WhatsApp.')},function(){showMsg('Select and copy this message:')})}catch(er){showMsg('Select and copy this message:')}
        break}
    }
  });
  function showMsg(label){var o=document.getElementById('msgOut');if(o)o.innerHTML='<p class="hint" style="text-align:left;margin-top:6px">'+esc(label)+'</p><div class="msgbox">'+esc(orderMessage())+'</div>'}

  document.addEventListener('change',function(e){
    if(e.target.id==='sLogo'&&e.target.files[0]){resizeImage(e.target.files[0],function(url){if(!url){toast('That logo couldn’t be opened. Try a JPG or PNG.');return}if(url){pendingLogo=url;var lp=document.getElementById('logoPrev');if(lp)lp.innerHTML='<img src="'+url+'" alt="">'}},true);return}
    if((e.target.id==='pImg1'||e.target.id==='pImg2')&&e.target.files[0]){
      var key=e.target.id==='pImg1'?'image':'image2';
      makeBoth(e.target.files[0],function(o){
        if(!o){var pe=document.getElementById('pErr');if(pe)pe.textContent='That photo couldn’t be opened. Try a JPG or PNG photo, or take a screenshot of it and upload that.';return}
        pend[key]=o;keepEdit(renderSheet);
      });
    }
  });

  /* back button: one step at a time inside the store */
  var layers=[],skipPop=0;
  function pushLayer(k){try{history.pushState({gs:k,n:layers.length+1},'');layers.push(k)}catch(e){}}
  function dropLayers(kinds){var n=0;for(var i=layers.length-1;i>=0;i--){if(kinds.indexOf(layers[i])>=0){layers.splice(i,1);n++}}if(n){skipPop+=n;try{history.go(-n)}catch(e){skipPop-=n}}}
  window.addEventListener('popstate',function(){
    if(skipPop>0){skipPop--;return}
    var k=layers.pop();
    if(k==='zoom'){closeZoom()}
    else if(k==='sheet'){if(document.getElementById('zoomer'))closeZoom();closeSheet0()}
    else if(k==='cat'){cat='All';brand='All';q='';var qi=document.getElementById('q');if(qi)qi.value='';refreshGrid();var ct=document.getElementById('cats');if(ct)ct.scrollIntoView({block:'center'})}
  });
  startPetals();
  render();
  try{var hid=(location.hash||'').slice(1);if(hid&&pack(hid))openSheet('view',hid)}catch(e){}
  if(window.claude&&window.claude.use){
    window.claude.use('user').then(function(u){return u?u.canEdit():false}).then(function(ok){
      if(!ok)return;canEdit=true;
      window.claude.use('assets').then(function(x){assetsApi=x}).catch(function(){});window.claude.use('db').then(function(x){dbApi=x;if(x)setTimeout(sendNeededPhotos,4000)}).catch(function(){});
      return window.claude.use('artifact').then(function(a){artifactApi=a;keepInputs(render)});
    }).catch(function(){});
  }
})();
</script>
</body></html>
